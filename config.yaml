# Filters, thresholds, and rate limits. Secrets stay in env / GitHub / Worker.

login:
  # YC username/password form (not the magic-link /email page)
  start_url: "https://account.ycombinator.com/?continue=https%3A%2F%2Fwww.workatastartup.com%2F"
  check_url: "https://www.workatastartup.com/companies"

search:
  # Fallback if search.sources is empty. Copy a filtered WAAS URL from the address bar.
  url: "https://www.workatastartup.com/companies?demographic=any&hideJobless=true&quick_apply=true&hasSalary=any&usVisaNotRequired=true&jobType=fulltime&sortBy=created_desc&role=eng&remote=only"
  max_pages: 20
  delay_seconds: [2, 6]
  job_url_template: "https://www.workatastartup.com/jobs/{job_id}"
  # Three separate listings. Overlaps insert once (same job URL).
  sources:
    - name: remote_eng
      url: "https://www.workatastartup.com/companies?demographic=any&hideJobless=true&quick_apply=true&hasSalary=any&usVisaNotRequired=true&jobType=fulltime&sortBy=created_desc&role=eng&remote=only"
      max_pages: 20
    - name: india_eng
      url: "https://www.workatastartup.com/companies?demographic=any&hideJobless=true&quick_apply=true&hasSalary=any&usVisaNotRequired=true&jobType=fulltime&sortBy=created_desc&role=eng&locations=India"
      max_pages: 12
    - name: exp_1_2
      url: "https://www.workatastartup.com/companies?demographic=any&hideJobless=true&quick_apply=true&hasSalary=any&usVisaNotRequired=true&jobType=fulltime&sortBy=created_desc&role=eng&minExperience=1&minExperience=2"
      max_pages: 12

filters:
  role_keywords:
    - software engineer
    - backend
    - back-end
    - fullstack
    - full-stack
    - full stack
    - frontend
    - front-end
    - machine learning
    - ml engineer
    - frontend
    - data scientist
    - python
    - typescript
    - react
  skip_keywords:
    - intern
    - internship
    - principal
    - staff
    - distinguished
    - director
    - vp
    - head of
    - founder
  require_remote_or_india: true
  remote_or_india_keywords:
    - remote
    - india
    - bengaluru
    - bangalore
    - worldwide
    - anywhere
    - work from anywhere
    - visa not required
    - us visa not required

match:
  threshold: 10
  resume_variants:
    fullstack: data/resumes/fullstack.txt
    backend: data/resumes/backend.txt
    frontend: data/resumes/frontend.txt

draft:
  provider: gemini # groq | gemini
  groq_model: llama-3.3-70b-versatile
  gemini_model: gemini-2.5-flash
  max_sentences: 5
  requests_per_minute: 5

submit:
  daily_cap: 5
  # Approve path is live (Apply → fill LLM note → Send). Local: --dry-run.
  dry_run: false
  # Text resumes only (same files as matching). No PDF required.
  resume_files:
    fullstack: data/resumes/fullstack.txt
    backend: data/resumes/backend.txt
    frontend: data/resumes/frontend.txt

email:
  digest_subject: "YC jobs digest — {n} to review"
  daily_report_subject: "YC daily report — {submitted} applied, {failed} failed ({date})"
  approval_base_url: "https://yc-job-approve.sanjaykandpal4.workers.dev"
  token_ttl_hours: 48

github:
  owner: sanjay-kandpal
  repo: Yc-auto-apply
