name: scan-wellfound

on:
  schedule:
    # 02:00, 10:00, 18:00 UTC — 2h from YC scan (00/04/08/12/16/20) so jobs-db never starts together.
    - cron: "0 2,10,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    concurrency:
      group: jobs-db
      cancel-in-progress: false
    env:
      WELLFOUND_EMAIL: ${{ secrets.WELLFOUND_EMAIL }}
      WELLFOUND_PASSWORD: ${{ secrets.WELLFOUND_PASSWORD }}
      WELLFOUND_SESSION_COOKIES: ${{ secrets.WELLFOUND_SESSION_COOKIES }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
      RECORD_RUN: "true"
      SPECTATE_WORKFLOW: scan-wellfound
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-cached-python
        with:
          with-playwright: "true"
      - name: Init DB
        run: python src/db.py --init
      - name: Scrape
        env:
          RECORDING_DIR: ${{ runner.temp }}/spectate-raw
        run: python src/wellfound/scrape.py
      - name: Match
        run: python src/match.py --source wellfound
      - name: Draft
        run: python src/draft.py --source wellfound
      - name: Email digest
        run: python src/email_digest.py --source wellfound
      - name: Dashboard
        run: python src/dashboard.py
      - name: Commit state
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MSG: wellfound scan run
        run: bash scripts/commit_state.sh
      - name: Upload raw recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectate-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/spectate-raw
          if-no-files-found: ignore
          retention-days: 1

  spectate:
    needs: scan
    if: always() && needs.scan.result != 'cancelled'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-cached-python
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: spectate-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/spectate-raw
      - uses: ./.github/actions/publish-recording
        with:
          workflow: scan-wellfound
