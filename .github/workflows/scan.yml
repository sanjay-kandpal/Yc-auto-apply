name: scan

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    concurrency:
      group: jobs-db
      cancel-in-progress: false
    env:
      YC_EMAIL: ${{ secrets.YC_EMAIL }}
      YC_PASSWORD: ${{ secrets.YC_PASSWORD }}
      YC_SESSION_COOKIES: ${{ secrets.YC_SESSION_COOKIES }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
      RECORD_RUN: "true"
      SPECTATE_WORKFLOW: scan
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-cached-python
        with:
          with-playwright: "true"
      - name: Init DB
        run: python src/db.py --init
      - name: Scrape
        env:
          RECORDING_DIR: ${{ runner.temp }}/spectate-raw
        run: python src/scrape.py
      - name: Match
        run: python src/match.py
      - name: Draft
        run: python src/draft.py
      - name: Email digest
        run: python src/email_digest.py
      - name: Dashboard
        run: python src/dashboard.py
      - name: Commit state
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MSG: scan run
        run: bash scripts/commit_state.sh
      - name: Upload raw recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectate-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/spectate-raw
          if-no-files-found: ignore
          retention-days: 1

  spectate:
    needs: scan
    if: always() && needs.scan.result != 'cancelled'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-cached-python
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: spectate-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/spectate-raw
      - uses: ./.github/actions/publish-recording
        with:
          workflow: scan
