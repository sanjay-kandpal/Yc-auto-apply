name: scan

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: jobs-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      YC_EMAIL: ${{ secrets.YC_EMAIL }}
      YC_PASSWORD: ${{ secrets.YC_PASSWORD }}
      YC_SESSION_COOKIES: ${{ secrets.YC_SESSION_COOKIES }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Init DB
        run: python src/db.py --init
      - name: Scrape
        run: python src/scrape.py
      - name: Match
        run: python src/match.py
      - name: Draft
        run: python src/draft.py
      - name: Email digest
        run: python src/email_digest.py
      - name: Dashboard
        run: python src/dashboard.py
      - name: Commit state
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "yc-job-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db docs/index.html
          git commit -m "scan run" || true
          ok=0
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              ok=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "git push race, retry $i"
            sleep $((i * 5))
          done
          test "$ok" -eq 1
