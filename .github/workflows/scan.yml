name: scan

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: jobs-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      YC_EMAIL: ${{ secrets.YC_EMAIL }}
      YC_PASSWORD: ${{ secrets.YC_PASSWORD }}
      YC_SESSION_COOKIES: ${{ secrets.YC_SESSION_COOKIES }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-cached-python
        with:
          with-playwright: "true"
      - name: Init DB
        run: python src/db.py --init
      - name: Scrape
        run: python src/scrape.py
      - name: Match
        run: python src/match.py
      - name: Draft
        run: python src/draft.py
      - name: Email digest
        run: python src/email_digest.py
      - name: Dashboard
        run: python src/dashboard.py
      - name: Commit state
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MSG: scan run
        run: bash scripts/commit_state.sh
