name: daily-report

on:
  schedule:
    # 10:00pm IST = 16:30 UTC
    - cron: "30 16 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: IST date whose 10pm closes the window (YYYY-MM-DD). Leave empty for the last completed 10pm period.
        required: false
        type: string

concurrency:
  group: jobs-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-cached-python
      - name: Init DB
        run: python src/db.py --init
      - name: Send daily report
        env:
          REPORT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            python src/daily_report.py --date "$REPORT_DATE"
          else
            python src/daily_report.py
          fi
