name: submit

on:
  repository_dispatch:
    types: [job_approved, job_rejected]

permissions:
  contents: write

jobs:
  handle:
    runs-on: ubuntu-latest
    concurrency:
      group: jobs-db
      cancel-in-progress: false
    env:
      YC_EMAIL: ${{ secrets.YC_EMAIL }}
      YC_PASSWORD: ${{ secrets.YC_PASSWORD }}
      YC_SESSION_COOKIES: ${{ secrets.YC_SESSION_COOKIES }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
      # Approve always sends. Scan and Reject never apply. Local --dry-run still works.
      SUBMIT_DRY_RUN: "false"
      RECORD_RUN: "true"
      RECORDING_DIR: ${{ runner.temp }}/spectate-raw
      SPECTATE_WORKFLOW: submit
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-cached-python
        with:
          with-playwright: "true"
      - name: Reject
        if: github.event.action == 'job_rejected'
        run: python src/db.py --mark-rejected "${{ github.event.client_payload.job_id }}"
      - name: Submit
        if: github.event.action == 'job_approved'
        run: python src/submit.py --job-id "${{ github.event.client_payload.job_id }}"
      - name: Write notify payload
        if: always()
        run: python src/notify.py --job-id "${{ github.event.client_payload.job_id }}" --write-payload "$RUNNER_TEMP/notify-payload.json"
      - name: Dashboard
        run: python src/dashboard.py
      - name: Commit state
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          COMMIT_MSG: submit run
        run: bash scripts/commit_state.sh
      - name: Upload raw recordings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectate-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/spectate-raw
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload notify payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notify-payload-${{ github.run_id }}
          path: ${{ runner.temp }}/notify-payload.json
          if-no-files-found: ignore
          retention-days: 3

  spectate:
    needs: handle
    if: always() && needs.handle.result != 'cancelled'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-cached-python
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: spectate-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/spectate-raw
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: notify-payload-${{ github.run_id }}
          path: ${{ runner.temp }}
      - uses: ./.github/actions/publish-recording
        with:
          workflow: submit
          job_id: ${{ github.event.client_payload.job_id }}
