name: submit

on:
  repository_dispatch:
    types: [job_approved, job_rejected]

concurrency:
  group: jobs-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  handle:
    runs-on: ubuntu-latest
    env:
      YC_EMAIL: ${{ secrets.YC_EMAIL }}
      YC_PASSWORD: ${{ secrets.YC_PASSWORD }}
      YC_SESSION_COOKIES: ${{ secrets.YC_SESSION_COOKIES }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}
      # Approve always sends. Scan and Reject never apply. Local --dry-run still works.
      SUBMIT_DRY_RUN: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium --with-deps
      - name: Reject
        if: github.event.action == 'job_rejected'
        run: python src/db.py --mark-rejected "${{ github.event.client_payload.job_id }}"
      - name: Submit
        if: github.event.action == 'job_approved'
        run: python src/submit.py --job-id "${{ github.event.client_payload.job_id }}"
      - name: Notify
        run: python src/notify.py --job-id "${{ github.event.client_payload.job_id }}"
      - name: Dashboard
        run: python src/dashboard.py
      - name: Commit state
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "yc-job-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.db docs/index.html
          git commit -m "submit run" || true
          ok=0
          for i in 1 2 3; do
            git fetch origin "$BRANCH"
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              ok=1
              break
            fi
            git rebase --abort 2>/dev/null || true
            echo "git push race, retry $i"
            sleep $((i * 5))
          done
          test "$ok" -eq 1
