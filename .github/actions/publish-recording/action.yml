name: Publish spectate recording
description: Merge raw Playwright clips, attach mp4 to a GitHub Release, prune old recordings, email links.

inputs:
  workflow:
    description: scan or submit
    required: true
  job_id:
    description: Job id for submit notify. Empty on scan.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Ensure ffmpeg
      shell: bash
      run: command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)

    - name: Merge clips
      shell: bash
      env:
        SPECTATE_WORKFLOW: ${{ inputs.workflow }}
      run: |
        mkdir -p "$RUNNER_TEMP/spectate-raw" "$RUNNER_TEMP/spectate-out"
        python src/record_video.py \
          --raw-dir "$RUNNER_TEMP/spectate-raw" \
          --out-dir "$RUNNER_TEMP/spectate-out" \
          --workflow "${{ inputs.workflow }}" \
          --run-id "$GITHUB_RUN_ID"

    - uses: actions/upload-artifact@v4
      with:
        name: spectate-${{ inputs.workflow }}-${{ github.run_id }}
        path: ${{ runner.temp }}/spectate-out/*.mp4
        if-no-files-found: ignore
        retention-days: 14

    - name: Publish GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SPECTATE_WORKFLOW: ${{ inputs.workflow }}
      run: |
        python src/publish_release.py \
          --out-dir "$RUNNER_TEMP/spectate-out" \
          --workflow "${{ inputs.workflow }}" \
          --run-id "$GITHUB_RUN_ID" \
          --attempt "$GITHUB_RUN_ATTEMPT"

    - name: Prune old recording releases
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: python src/prune_recordings.py

    - name: Email scan recording
      if: ${{ inputs.workflow == 'scan' }}
      shell: bash
      run: python src/spectate_email.py --out-dir "$RUNNER_TEMP/spectate-out"

    - name: Notify submit
      if: ${{ inputs.job_id != '' }}
      shell: bash
      run: |
        META="$RUNNER_TEMP/spectate-out/meta.json"
        URL=""
        if [ -f "$META" ]; then
          URL=$(python -c "import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(json.loads(p.read_text()).get('release_url') or '')" "$META")
        fi
        export RECORDING_RELEASE_URL="$URL"
        PAYLOAD="$RUNNER_TEMP/notify-payload.json"
        if [ -f "$PAYLOAD" ]; then
          python src/notify.py --payload "$PAYLOAD"
        else
          python src/notify.py --job-id "${{ inputs.job_id }}"
        fi
